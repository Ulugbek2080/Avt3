name: Java CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Start SUT
        run: |
          java -jar ./artifacts/app-order.jar &
          sleep 15

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true